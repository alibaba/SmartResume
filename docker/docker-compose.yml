
services:
  smartresume:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: smartresume-app
    volumes:
      - ../configs:/app/configs
      - ../models:/app/models
    ports:
      - "4999:4999"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - SMARTRESUME_ONNX_DEVICE=cuda
      - SMARTRESUME_CONFIG=/app/configs/config.yaml
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: python demo/web_app.py
    restart: unless-stopped
